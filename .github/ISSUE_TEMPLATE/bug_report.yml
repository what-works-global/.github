name: Bug report
description: Something isn't working as documented or expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The smallest reproduction you can manage is the single most useful thing you can include.

        **Found a security vulnerability?** Don't file it here. Follow the [security policy](https://github.com/what-works-global/.github/blob/main/SECURITY.md) instead.

  - type: input
    id: where
    attributes:
      label: Where
      description: The package and version, or the site and the page, admin screen or route.
      placeholder: "e.g. @whatworks/payload-redirects 0.3.0 — or — /admin/collections/pages on staging"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include the full error message or stack trace if there is one.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Steps, a config snippet, a failing test or a link to a small repository.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions of the frameworks and runtime involved, plus anything else relevant (browser, database, hosting, OS). Skip what doesn't apply.
      placeholder: |
        Node: 22.x
        Payload 3.x / Next.js 16.x
        Browser: Safari 19 on macOS
    validations:
      required: false
