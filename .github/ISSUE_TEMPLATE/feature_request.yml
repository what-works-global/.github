name: Feature request
description: Suggest a new capability or a change in behaviour
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem rather than the solution. It's the part we can most easily help with. For a public package, a discussion is a fine place to start if the idea is still rough.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What are you doing, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Your proposed change, if you have one. Rough is fine.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds, other approaches, or why existing options don't fit.
    validations:
      required: false
