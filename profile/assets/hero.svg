<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">What Works</title>
  <desc id="hero-desc">We find what works, and deliver on it. Strategy &amp; Creative. Growth &amp; Marketing. Product Development. AI &amp; Technologies.</desc>
  <!--
    What Works - GitHub organisation profile hero
    Ground: deep-works ink #020f18 (self-contained; renders identically in GitHub light and dark themes)
    Accent: cyan-works #95f1f3, used once - the block in the wordmark
    Wordmark: embedded brand PNG, recoloured via feFlood/feComposite alpha fill (no font redistribution)
    Motion: one slow breathe on the cyan block; disabled under prefers-reduced-motion; static frame is complete
  -->
  <defs>
    <image id="wm" width="1286" height="100" href="data:image/png;base64,"/>
    <filter id="fill-paper"><feFlood flood-color="#f4f7f8"/><feComposite in2="SourceAlpha" operator="in"/></filter>
    <filter id="fill-cyan"><feFlood flood-color="#95f1f3"/><feComposite in2="SourceAlpha" operator="in"/></filter>
    <clipPath id="block"><rect x="505" y="-4" width="164" height="108"/></clipPath>
  </defs>
  <style>
    .breathe { animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .breathe { animation: none; } }
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1200" height="320" rx="24" fill="#020f18"/>
  <g transform="translate(290 82) scale(0.4821)">
    <use href="#wm" filter="url(#fill-paper)"/>
    <g clip-path="url(#block)"><use href="#wm" filter="url(#fill-cyan)" class="breathe"/></g>
  </g>
  <text x="600" y="206" text-anchor="middle" font-size="22" fill="#c9d3d8">We find <tspan fill="#ffffff" font-weight="500">what works</tspan>, and deliver on it.</text>
  <text x="600" y="256" text-anchor="middle" font-size="14" letter-spacing="1.8" fill="#78909b">STRATEGY &amp; CREATIVE&#160;&#160;&#183;&#160;&#160;GROWTH &amp; MARKETING&#160;&#160;&#183;&#160;&#160;PRODUCT DEVELOPMENT&#160;&#160;&#183;&#160;&#160;AI &amp; TECHNOLOGIES</text>
</svg>
